# agent.yaml — the BriefAgent manifest (manifest schema v1).
#
# This file is the whole contract: what the BriefAgent is, where its
# instructions live, and — most importantly — what it may touch. The
# registry scans releases against these declarations, clients display and
# diff them on install, and the SecureAgentry runner ENFORCES them: an
# undeclared capability is a tool your BriefAgent simply does not have.
#
# Every option is shown below; commented lines are the alternatives.
# Full field-by-field documentation: README.md in this template, and
# https://docs.secureagentry.net.

# The manifest schema major. Only "1" exists today.
schemaVersion: "1"

# Identity. name is lowercase [a-z0-9-], up to 64 chars; namespace is the
# publishing handle (yours, or your org's) that owns the BriefAgent.
# Rename both — these are placeholders.
name: my-briefagent
namespace: your-namespace

# What kind of BriefAgent this is (pick exactly one):
#   skill        — an instruction package (Claude-skill-shaped); the
#                  entrypoint below names the skill file. Runnable.
#   prompt-agent — pure instructions, no code entrypoint: put the prompt
#                  in AGENT.md (or PROMPT.md) at the repo root. Runnable.
#   mcp-server   — a tool server other BriefAgents can use; declares an
#                  mcp entrypoint instead. NOT runnable on its own.
kind: skill

# Strict semver, no leading "v". Must match the git tag when publishing
# from a tag, and must exceed every version already on the channel.
version: 0.1.0

# One plain-text line, at most 140 characters. Shown everywhere.
summary: "Reads the task and workspace, then writes a short report"

# SPDX license identifier. Required for public publication.
license: MIT

# Optional credits (email optional per author).
authors:
  - name: Your Name
    # email: you@example.com

# Optional informational URL, shown on the BriefAgent's page.
homepage: https://github.com/blaktron/agentry-template

# Optional lowercase [a-z0-9-] tags for search facets.
tags: [template, example]

# Entrypoints — exactly the keys valid for the kind above.
entrypoints:
  # kind: skill — the repo-relative skill file (frontmatter + instructions).
  skill: SKILL.md
  # kind: mcp-server — how to launch the server (and nothing else):
  # mcp:
  #   command: node          # the executable (node, python, …)
  #   args: [server.js]      # args naming repo files must be in publish.include
  #   transport: stdio       # stdio | http

# Informational runtime hints.
runtime:
  # Free-form model hint patterns. A hint, never a lock: the operator's
  # runner policy picks the model that actually runs.
  models: ["claude-*"]
  # Which `agentry install` targets this package supports:
  #   claude-skill — ~/.claude/skills/<name>/ with SKILL.md frontmatter
  #   mcp          — extract + merge a server entry into .mcp.json
  #   agents-md    — extract + upsert a section in ./AGENTS.md
  interfaces: [claude-skill, agents-md]

# ── The security contract ──────────────────────────────────────────────
# Closed vocabulary. Empty/omitted = a pure-text BriefAgent (only the
# write_report tool at run time). Declare the LEAST you need: reviewers
# gate on this, installs prompt on it, and the runner enforces it.
capabilities:
  network:
    # none            — no egress; no fetch tool.
    # [exact.host, …] — the fetch tool, pinned to these DNS names (the
    #                   runner also enforces at container level).
    # "*"             — unrestricted egress; refused at run time unless
    #                   the operator's policy sets allowWildcardEgress.
    egress: none
  filesystem:
    # none | workspace | { paths: [repo/relative, …] } for each direction.
    # read grants fs_read + fs_list; write grants fs_write. paths mode
    # limits tools (and the runner's mounts) to exactly those paths.
    read: workspace
    write: none
  # none | { commands: [single-token, …] } — commands grants run_command,
  # restricted to exactly these binaries.
  exec: none
  # Environment variable NAMES the BriefAgent needs — never values. The
  # runner resolves them from the operator's secret source and injects
  # them only into the tools container; the fetch tool can send one as an
  # auth header without the value ever entering model context.
  # secrets: [MY_API_TOKEN]
  # Semantic data categories touched, for review and audit:
  # email | calendar | files | tickets | code | messages | payments | other
  # dataAccess: [tickets]
  # MCP servers this BriefAgent requires (RUNNER-PLAN-3): exactly one of
  # npm/pypi per entry, and an EXACT version — the pin is part of this
  # release, so a new version is a new supply-chain decision. The runner
  # installs them from the operator's trusted registries and loads them
  # for this exact release signature only; removal deletes their
  # configuration and keys unless explicitly kept.
  # mcpServers:
  #   - npm: "@modelcontextprotocol/server-github"
  #     version: 2026.1.2
  #     tools: [list_issues]        # optional allowlist within the server
  #     secrets: [GITHUB_PAT]       # names only; collected by guided setup
  #     egress: [api.github.com]    # the server's own outbound allowlist

# Informational in v1 (no auto-install): other BriefAgents this one
# expects to exist.
# dependencies:
#   agents:
#     - ref: acme/other-agent
#       version: "^1.2"

# What ships in the release archive — an ALLOWLIST of glob patterns
# (path.Match segments; "**" matches any number of segments). Nothing
# else is packed. channel is stable (default) or beta.
publish:
  include: [agent.yaml, README.md, SKILL.md, LICENSE]
  channel: stable
