# agent.yaml: the QuickAgent manifest, schema v2.
#
# The manifest says what the QuickAgent is, where its instruction lives and
# what it may touch. The registry scans each release against it, an install
# shows it and asks for consent, and the Agentry runner enforces it: a
# capability this file does not declare is a tool the run does not have.
#
# The uncommented lines are a working QuickAgent that reads the files a
# person gives it and writes a report. Commented lines show every other
# option, with its limits. The field-by-field reference is
# https://docs.secureagentry.net/quickagents/.

# The schema major. Write "2". Releases published under "1" (the old
# kind-based manifest) still run, but only v2 can use most blocks below.
schemaVersion: "2"

# Identity: rename both. name is lowercase letters, digits and hyphens, at
# most 65 characters, starting and ending with a letter or digit. namespace
# is your handle or your organization's, at most 39 characters.
name: my-quickagent
namespace: your-namespace

# How the QuickAgent runs: one mode or both.
#   autonomous:  runs from its task and files (after the intake questions, if
#                any), writes its result and reports, and ends.
#   interactive: the same plan and controls, but the run is a conversation
#                (a chat in the terminal, the desktop's run panel, a session
#                in Agentry). The person can answer and add files; nothing
#                they say widens the capabilities below.
modes: [autonomous]
# modes: [autonomous, interactive]

# Strict semver, no leading "v". It must equal the git tag when you publish
# from a tag, and be higher than every version already on the channel.
version: 0.1.0

# One plain-text line, at most 140 characters. Shown wherever the
# QuickAgent is listed.
summary: "Reads the files you give it and writes a short report on what your task asks"

# An SPDX identifier (or expression), with a LICENSE file beside it.
# Required to publish publicly.
license: MIT

# Optional. Each author has a name and, optionally, an email.
authors:
  - name: Your Name
    # email: you@example.com

# Optional, shown on the QuickAgent's page.
# homepage: https://example.com/my-quickagent

# Optional search tags: lowercase letters, digits and hyphens, at most 10.
tags: [reports, documents]

# The instruction file, AGENT.md when omitted. Leading YAML frontmatter (the
# Agent Skills SKILL.md shape) is stripped, so a SKILL.md works as it is:
# `instruction: SKILL.md`. publish.include must match it.
entrypoints:
  instruction: AGENT.md

# What a person reads before a run: the run setup on the site, in the
# desktop and in Agentry, and `agentry run` on a terminal. People only: the
# agent never sees it, and a change to it asks nobody to consent again.
# Leave out a part with nothing to say; without the block, the setup derives
# the steps from the summary, the intake and the capabilities.
guide:
  # Markdown, at most 4,096 bytes: what it does and what it returns.
  overview: |
    Reads the files you add and writes `report.md`: what your task asked,
    what the files say about it, and what they leave open.
  # At most 10 items, one line of at most 200 characters each.
  prepare:
    - The files the task is about, as documents, text or data.
    - One sentence saying what you want the report to answer.
  # One line, at most 500 characters.
  files: "Add the documents or data to report on: PDF, Word, Markdown, text, CSV or JSON."
  # The task field's placeholder: one line, at most 200 characters.
  task: "e.g. What do these meeting notes decide about the Q3 launch?"
  # Help for each declared secret, by name: Markdown, at most 2,000
  # characters each. Every key must be a secret this file declares.
  # connect:
  #   MY_API_TOKEN: |
  #     Create a **read-only** token at https://example.com/settings/tokens.

# What files the QuickAgent takes, and which view of an input its agent
# reads first. It grants nothing (adding a file is the grant), so it is
# outside the contract. Without it any file is taken and each keeps its own
# default view.
inputs:
  kinds: [documents, data]   # documents | code | data | images, or any on its own
  view: text                 # text (decoded text) | original (as uploaded) | both

# Questions asked before a run, in either mode. Answers reach the agent
# read-only in /inputs/intake.json, and every answer but a secret is in the
# run's receipts. At most 20 questions; an id is [a-z0-9_], at most 64
# characters, and unique. Ask only what changes from run to run.
# intake:
#   - id: audience
#     prompt: "Who is the report for?"
#     # type: text is the default
#   - id: depth
#     prompt: "How long a report?"
#     type: choice
#     choices: [short, detailed]
#   - id: dataset
#     prompt: "The dataset to analyse"
#     type: file               # staged with the run's other inputs
#     required: true
#   - id: repository
#     prompt: "The repository to review"
#     type: repository         # an https git URL; #branch, #tag or a full commit
#   - id: advisory
#     prompt: "The advisory to check against"
#     type: url                # one https file, fetched before the run
#   - id: my_api_token
#     prompt: "Your API token"
#     type: secret             # needs MY_API_TOKEN under capabilities.secrets;
#     required: true           # required matches it (absent if optional)
#   - id: server
#     prompt: "The server to set up"
#     type: host               # [user@]host[:port]; listed in targetHosts
#     required: true
#
# A repository or url answer is fetched by the runner into /inputs/<id>/
# before the run starts. It needs no egress and no secret: giving the source
# is the grant, and the run setup asks for a token beside it when the source
# is private.

# Interactive sessions only (validation warns if interactive is not among
# the modes). Budgets, wall time and the idle limit are the operator's
# policy; these hints can only ask for less.
# interactive:
#   opening: "What should the report answer?"   # at most 500 characters
#   idleTimeoutSeconds: 900

# Knowledge packs. ships names packs the release carries under
# knowledge/<name>/, made with `agentry knowledge create` (at most 5, each
# at most 10 MB); they are scanned and signed with the release and are part
# of the contract. accepts asks the person to attach a pack of their own
# when they run it; the agent never sees the prompt.
# knowledge:
#   ships:
#     - name: style-guide
#   accepts:
#     prompt: "Your team's runbooks, if you have them"   # one line, at most 300 characters
#     required: false

# Informational hints.
runtime:
  # Model name patterns. A hint, not a lock: the runner's policy, or the
  # person's own sign-in, decides the model that runs.
  models: ["claude-*"]
  # The coding-agent exports this package supports, asked for by name with
  # `agentry install --target`: claude-skill (a skill under ~/.claude/skills)
  # and agents-md (a section in ./AGENTS.md).
  interfaces: [claude-skill, agents-md]

# ── The capability contract ──────────────────────────────────────────────
# A closed vocabulary. Declare only what the instruction uses: reviewers
# read it, an install asks consent for it, and the runner enforces it.
# Every run also gets, without declaring anything: the input tools
# (list_inputs, read_input, search_inputs), write_report, a private scratch
# folder (scratch_write, scratch_read, scratch_list, scratch_search) and
# export_pdf.
capabilities:
  network:
    # none:            no network and no fetch tool.
    # [exact.host, …]: the fetch tool, to these DNS names only.
    # "*":             any host; refused at run time unless the operator's
    #                  policy sets allowWildcardEgress.
    egress: none
  filesystem:
    # none | workspace | { paths: [relative/path, …] }, for each direction.
    # read grants fs_read and fs_list; write grants fs_write. In a run the
    # workspace is the QuickAgent's own package, not the person's files:
    # those arrive as inputs, which need no grant.
    read: none
    write: none
  # none | { commands: [sha256sum, diff, …] }: run_command, limited to them.
  # Prefer the commands every machine provides (listed at
  # https://docs.secureagentry.net/runner/#the-commands-every-machine-provides);
  # others run only where the operator's catalogue has them. To work on a
  # remote machine, declare a target host rather than ssh.
  exec: none
  # Environment variable NAMES, never values. A required secret the run
  # cannot resolve stops it before it starts (exit 11). fetch can send one
  # as an auth header without the model ever seeing the value.
  # secrets: [MY_API_TOKEN]
  # Declared secrets a run can do without. Each must already be declared,
  # here or by an MCP server; every other declared secret is required.
  # optionalSecrets: [MY_API_TOKEN]
  # The ids of the intake's host questions, at most 4. The agent may run
  # any command the person's account can run on that machine, through the
  # runner's host tools; the manifest never names the machine. Local runs
  # only: a run in Agentry refuses a target host.
  # targetHosts: [server]
  # Categories of data it touches, for review and audit:
  # email | calendar | files | tickets | code | messages | payments | other
  dataAccess: [files]
  # MCP servers the QuickAgent needs, at most 8. A package server names one
  # of npm or pypi and an EXACT version: the pin is part of the release, so
  # a new version is a new supply-chain decision. The runner installs it
  # from the operator's registries for this release only. A remote server
  # is named by its https address and takes no version, egress, env or
  # oauth. Check that a server runs here before you declare it:
  # https://docs.secureagentry.net/runner/#declared-mcp-servers-runner-plan-3
  # mcpServers:
  #   - npm: github-mcp-server-js        # or pypi: <name>
  #     version: 0.1.7                   # exact; ranges are refused
  #     tools: [list_issues, get_issue]  # optional allowlist; omit for all
  #     secrets: [GITHUB_TOKEN]          # NAMES the server reads
  #     env:                             # plain settings, never a secret
  #       GITHUB_PERMISSION: read-only   # (at most 16, in the release diff)
  #     egress: [api.github.com]         # the server's own hosts
  #   - url: https://mcp.linear.app/mcp  # a remote server
  #     auth: oauth                      # oauth | secret | none
  #     scopes: [read]                   # what consent asks for (oauth only)
  #     tools: [list_issues]
  #   - url: https://api.githubcopilot.com/mcp/readonly
  #     auth: secret                     # its one secret, as a bearer header
  #     secrets: [GITHUB_TOKEN]
  # A package server can sign in by OAuth too, with an oauth block (issuer,
  # scopes, and the files or env the access token is written into). Copy one
  # the docs list exactly rather than writing your own:
  # https://docs.secureagentry.net/quickagents/ ("Remote servers and OAuth
  # sign-in").

# Informational: other QuickAgents this one expects. Shown, not installed.
# dependencies:
#   agents:
#     - ref: acme/other-agent
#       version: "^1.2"

# The release archive's ALLOWLIST of glob patterns ("**" matches any number
# of path segments). Nothing else ships, so stray files cannot leak into a
# release. It must match agent.yaml and the instruction file; add
# output.schema.json, support files or knowledge/** when you use them.
publish:
  include: [agent.yaml, AGENT.md, README.md, LICENSE]
  channel: stable              # stable (default) | beta
